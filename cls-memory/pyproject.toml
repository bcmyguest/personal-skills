[project]
name = "cls-memory"
version = "0.1.0"
description = "Organizational memory built on Complementary Learning Systems: a VAE neocortex and a Modern Hopfield hippocampus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cls_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
