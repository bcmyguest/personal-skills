# Automated dependency updates. The `uv` ecosystem understands pyproject.toml
# and uv.lock natively (GA since March 2025); minor/patch bumps arrive grouped
# as one weekly PR (CI runs `uv sync --locked`, so a lock bump that breaks the
# build fails visibly). GitHub Actions bumps are grouped the same way — that's
# what keeps the full-version setup-uv pin current (setup-uv stopped
# publishing moving major tags at v8).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
