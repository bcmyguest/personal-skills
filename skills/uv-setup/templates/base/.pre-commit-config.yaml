# After copying, refresh the pins with `uv run pre-commit autoupdate --freeze`
# (frozen SHAs are immutable; the tag comment is just a label — see the
# pre-commit-setup skill for the supply-chain rationale).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace      # strip trailing whitespace
      - id: end-of-file-fixer        # ensure exactly one trailing newline
      - id: mixed-line-ending        # normalize line endings (LF)
        args: [--fix=lf]
      - id: check-yaml               # validate YAML syntax
      - id: check-toml               # validate TOML syntax
      - id: check-json               # validate JSON syntax
      - id: check-added-large-files  # block accidental large blobs
      - id: check-merge-conflict     # block leftover conflict markers
      - id: check-case-conflict      # catch case-insensitive filename clashes

  # Conventional Commits — release.yml derives the version bump from these.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ruff from its official pre-commit mirror, mirroring ci.yml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 01a675ea018f2fb714478a5ffb83fcea8374bb06  # frozen: v0.15.21
    hooks:
      - id: ruff-check               # lint
        args: [--fix]
      - id: ruff-format              # format

  # pyrefly MUST be a local hook run via `uv run`: that executes this
  # project's own dev-dep pyrefly inside the project venv, where it can
  # resolve third-party imports. The published facebook/pyrefly-pre-commit
  # hook installs pyrefly into an isolated env WITHOUT your dependencies and
  # falsely reports `missing-import` for every third-party package — never
  # use it in a uv project.
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false        # pyrefly checks the whole project, not single files
        require_serial: true
