# Shipped complete — overwrites the pyproject.toml that `uv init --package`
# generated. Dev tooling is added AFTER the placeholder pass with
# `uv add --dev pytest ruff pyrefly pre-commit`, so dependency versions come
# from scaffold time, never from this template.
[project]
name = "{{project_name}}"
version = "0.1.0"  # never hand-bumped: release.yml stamps the tag version at build time
description = "{{description}}"
readme = "README.md"
license = "{{license}}"
requires-python = ">={{python_version}}"
dependencies = []

[project.urls]
Repository = "https://github.com/{{repo_slug}}"

# hatchling instead of uv init's generated uv_build block: hatchling is safe
# to leave unversioned (so this template hardcodes no version window, unlike
# uv_build's `>=X,<Y`) and auto-detects the src/ layout.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Build + install the project into the venv even without [project.scripts] —
# what makes `import {{package_snake}}` work from tests and a clean install.
[tool.uv]
package = true

[tool.pyrefly]
project-includes = ["src", "tests"]
# Keep in lockstep with .python-version and requires-python — bump together.
python-version = "{{python_version}}"

[tool.pytest.ini_options]
testpaths = ["tests"]
