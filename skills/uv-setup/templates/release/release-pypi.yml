name: release

# Every merge to main cuts a release: the plan job asks git-cliff for the
# next semver from the conventional commits since the last tag and runs the
# test suite; the release job pushes the vX.Y.Z tag and publishes a GitHub
# release with git-cliff release notes; the publish job builds sdist + wheel,
# validates the wheel in a clean env, and uploads to PyPI via Trusted
# Publishing (OIDC — no token, ever; the PyPI project must list this repo +
# release.yml + environment `pypi` as a trusted publisher, and a PENDING
# publisher can be registered before the project's first upload, so even the
# bootstrap release needs no token). If nothing releasable landed (only
# unconventional or chore(release) commits), the bumped version equals the
# latest tag and the run exits early.
#
# Manual runs (workflow_dispatch) skip the release half and only (re)publish
# the latest existing tag to PyPI — e.g. to backfill a version whose publish
# failed. Publishing is idempotent: if the version is already on PyPI the run
# exits early.
#
# The version in pyproject.toml stays at its committed value; the built
# distributions are stamped with the tag version at build time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {} # each job requests only what it needs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides what this run does (release, republish, or nothing), tests the
  # code, and renders the release notes the release job attaches later.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.bump.outputs.release }}
      skip: ${{ steps.bump.outputs.skip }}
      already: ${{ steps.published.outputs.already }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        if: github.event_name == 'push'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Sets three outputs: `version` (the vX.Y.Z being built), `release`
      # (tag + GitHub release wanted, i.e. a push with releasable commits),
      # and `skip` (nothing to do at all).
      - name: Compute version
        id: bump
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$latest" ]; then
              echo "No tags exist yet; nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Republishing latest tag $latest to PyPI."
            echo "version=$latest" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            next="$(git cliff --bumped-version)"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            if [ "$next" = "$latest" ]; then
              echo "Nothing to release: bumped version $next equals the latest tag."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Releasing $next (previous: ${latest:-none})."
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # PyPI returns 200 for a published version and 404 otherwise. Only
      # manual reruns can hit an already-published version; push runs always
      # carry a strictly newer one.
      - name: Check PyPI for this version
        id: published
        if: steps.bump.outputs.skip == 'false'
        run: |
          version="${{ steps.bump.outputs.version }}"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/{{project_name}}/${version#v}/json")"
          if [ "$status" = "200" ]; then
            echo "$version is already on PyPI."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.bump.outputs.release == 'true'

      - name: Test
        if: steps.bump.outputs.release == 'true'
        run: |
          uv sync --frozen
          uv run -m pytest

      - name: Render release notes
        if: steps.bump.outputs.release == 'true'
        run: |
          git cliff --unreleased --tag "${{ steps.bump.outputs.version }}" -o release-notes.md
          cat release-notes.md

      - name: Upload release notes
        if: steps.bump.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Pushes the tag and publishes the GitHub release. Skipped entirely on
  # manual republish runs.
  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Push tag
        run: |
          git tag "${{ needs.plan.outputs.version }}"
          git push origin "${{ needs.plan.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          body_path: release-notes.md

  # Builds and uploads to PyPI. Also the entire back half of a manual
  # republish run (where the release job is skipped).
  publish:
    needs: [plan, release]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.skip == 'false' && needs.plan.outputs.already == 'false' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted-publisher
    # registration; environments also let you add reviewers/branch rules.
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC — no long-lived secret)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Manual runs publish the tagged code, not whatever main has moved to.
      - name: Check out the tag
        if: needs.plan.outputs.release == 'false'
        run: git checkout "refs/tags/${{ needs.plan.outputs.version }}"

      # The committed version is never bumped; stamp the tag version in
      # before building so the distributions carry it.
      - name: Stamp version
        run: |
          version="${{ needs.plan.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${version#v}\"/" pyproject.toml

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Build sdist + wheel
        run: uv build

      # Prove the wheel installs and imports in a clean env before uploading.
      - name: Validate wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import {{package_snake}}"

      # Exchanges the run's OIDC identity for a short-lived PyPI token and
      # uploads dist/*. Fails if the PyPI project doesn't list this
      # repo/workflow/environment as a trusted publisher; the tag and GitHub
      # release above have already landed by then, so recover by registering
      # the publisher and re-running via workflow_dispatch.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
