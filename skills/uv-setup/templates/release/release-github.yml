name: release

# Every merge to main cuts a release: git-cliff computes the next semver from
# the conventional commits since the last tag, the run tests the code, pushes
# the vX.Y.Z tag, and publishes a GitHub release with generated notes. No
# package is uploaded anywhere — use release-pypi.yml for PyPI publishing.
# If nothing releasable landed (only unconventional or chore(release)
# commits), the bumped version equals the latest tag and the run exits early.
#
# The version in pyproject.toml stays at its committed value; the tag is the
# version of record.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Compute version
        id: bump
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next="$(git cliff --bumped-version)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$latest" ]; then
            echo "Nothing to release: bumped version $next equals the latest tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $next (previous: ${latest:-none})."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.bump.outputs.release == 'true'

      - name: Test
        if: steps.bump.outputs.release == 'true'
        run: |
          uv sync --frozen
          uv run -m pytest

      - name: Render release notes
        if: steps.bump.outputs.release == 'true'
        run: |
          git cliff --unreleased --tag "${{ steps.bump.outputs.version }}" -o release-notes.md
          cat release-notes.md

      - name: Push tag
        if: steps.bump.outputs.release == 'true'
        run: |
          git tag "${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.version }}"

      - name: Publish release
        if: steps.bump.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          body_path: release-notes.md
