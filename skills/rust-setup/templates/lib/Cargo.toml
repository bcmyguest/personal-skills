[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2024"
description = "{{description}}"
license = "{{license}}"
readme = "README.md"
repository = "https://github.com/{{repo_slug}}"
homepage = "https://github.com/{{repo_slug}}"
documentation = "https://docs.rs/{{crate_name}}"
keywords = []     # fill in — max 5, shown on crates.io search
categories = []   # fill in from https://crates.io/categories
exclude = [".github/", ".pre-commit-config.yaml", "cliff.toml"]

[dependencies]

[dev-dependencies]
