# wteam phase: three fresh-context reviewers on a non-code artifact.
# Install: copy this folder's phases/ and roles/ into $WTEAM_CONFIG_DIR (default ~/.config/wteam).
# Run: wteam phase artifact-review --input <path>
personas = ["artifact-claims", "artifact-critic", "artifact-scope"]
requires_input = true
brief = """
Review the inputs below as your role says. Fresh session — no prior chat; the author is
not available, so judge only what is on disk.
"""
